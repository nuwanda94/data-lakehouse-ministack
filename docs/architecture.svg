<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Local-first medallion lakehouse</title>
  <desc id="desc">Seed writes Bronze. Ingest Lambda and the local runner or Step Functions move data through Silver, a quality gate, and Gold. Glue, Athena, dbt, and the query UI read Gold.</desc>
  <style>
    .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 10; }
    .box2 { fill: #111827; stroke: #a78bfa; stroke-width: 2; rx: 10; }
    .box3 { fill: #111827; stroke: #34d399; stroke-width: 2; rx: 10; }
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; font-size: 14px; text-anchor: middle; }
    .s { font-family: ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; font-size: 11px; text-anchor: middle; }
    .h { font-family: ui-sans-serif, system-ui, sans-serif; fill: #38bdf8; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#020617"/>
  <text x="24" y="28" class="h" text-anchor="start">data-lakehouse-ministack</text>
  <text x="24" y="48" class="s" text-anchor="start">MiniStack :4566  ·  same Terraform on AWS</text>

  <rect class="box" x="30" y="80" width="140" height="70"/>
  <text class="t" x="100" y="110">make seed</text>
  <text class="s" x="100" y="130">synthetic events</text>

  <rect class="box" x="220" y="80" width="150" height="70"/>
  <text class="t" x="295" y="110">S3 bronze</text>
  <text class="s" x="295" y="130">JSON + SQS notify</text>

  <rect class="box" x="420" y="80" width="150" height="70"/>
  <text class="t" x="495" y="110">Silver Lambda</text>
  <text class="s" x="495" y="130">cleanse + contracts</text>

  <rect class="box2" x="620" y="80" width="140" height="70"/>
  <text class="t" x="690" y="110">Quality gate</text>
  <text class="s" x="690" y="130">pass / fail run</text>

  <rect class="box3" x="800" y="80" width="130" height="70"/>
  <text class="t" x="865" y="110">S3 gold</text>
  <text class="s" x="865" y="130">daily metrics</text>

  <path class="arrow" d="M170,115 H220"/>
  <path class="arrow" d="M370,115 H420"/>
  <path class="arrow" d="M570,115 H620"/>
  <path class="arrow" d="M760,115 H800"/>

  <rect class="box2" x="220" y="210" width="200" height="70"/>
  <text class="t" x="320" y="240">Local runner</text>
  <text class="s" x="320" y="258">python -m lakehouse</text>

  <rect class="box2" x="450" y="210" width="200" height="70"/>
  <text class="t" x="550" y="240">Step Functions</text>
  <text class="s" x="550" y="258">Map / Retry / Catch</text>

  <rect class="box3" x="680" y="210" width="250" height="70"/>
  <text class="t" x="805" y="240">DynamoDB</text>
  <text class="s" x="805" y="258">pipeline-runs · gold-metrics</text>

  <path class="arrow" d="M320,210 V150"/>
  <path class="arrow" d="M550,210 V150"/>
  <path class="arrow" d="M805,210 V150"/>

  <rect class="box3" x="220" y="320" width="160" height="64"/>
  <text class="t" x="300" y="348">Glue catalog</text>
  <text class="s" x="300" y="366">partitioned tables</text>

  <rect class="box3" x="410" y="320" width="160" height="64"/>
  <text class="t" x="490" y="348">Athena + dbt</text>
  <text class="s" x="490" y="366">named queries / marts</text>

  <rect class="box3" x="600" y="320" width="160" height="64"/>
  <text class="t" x="680" y="348">make ui</text>
  <text class="s" x="680" y="366">HTML + notebook</text>

  <path class="arrow" d="M865,150 V352 H760"/>
</svg>
