# MiniStack local AWS emulator for the medallion lakehouse.
# Single gateway on 4566 — S3, DynamoDB, SQS, Lambda, IAM, STS.
services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: lakehouse-ministack
    ports:
      - "4566:4566"
    environment:
      GATEWAY_PORT: "4566"
      LOG_LEVEL: INFO
      S3_PERSIST: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
