# Lint → pre-commit → unit → security → MiniStack up → Terraform → seed → pipeline → integration tests
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_EC2_METADATA_DISABLED: "true"
  HEALTH_TIMEOUT_SECONDS: "180"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format
        continue-on-error: true
        run: ruff format --check src tests scripts
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Unit + hermetic zone-path tests
        run: make test

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Hermetic secret scan
        run: python -m lakehouse security
      - name: Install Checkov
        run: python -m pip install checkov
      - name: Checkov Terraform
        run: checkov -d infra/terraform --config-file .checkov.yaml
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy version
      - name: Trivy secret scan
        run: |
          trivy fs --config trivy.yaml --scanners secret --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-files .env.example,Makefile,.github/workflows/ci.yml .

  ministack:
    name: ministack-pipeline
    runs-on: ubuntu-latest
    needs: [lint, unit, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Start MiniStack
        env:
          HEALTH_TIMEOUT_SECONDS: "180"
        run: |
          set -euxo pipefail
          docker version
          docker compose version
          make up
          curl -sS -o /dev/null -w "gateway HTTP %{http_code}\n" http://localhost:4566 || true
      - name: Apply Terraform
        run: make infra
      - name: Seed Bronze
        run: make seed
      - name: Run local pipeline
        run: make pipeline
      - name: Query Gold
        run: make query
      - name: Live integration tests
        run: make test-integration
      - name: MiniStack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200 ministack || true
