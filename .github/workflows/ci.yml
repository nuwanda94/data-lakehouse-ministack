# Lint → pre-commit → unit → MiniStack up → Terraform → seed → pipeline → integration tests
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_EC2_METADATA_DISABLED: "true"
  HEALTH_TIMEOUT_SECONDS: "90"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Unit + hermetic zone-path tests
        run: make test

  ministack:
    name: ministack-pipeline
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Start MiniStack
        run: make up
      - name: Apply Terraform
        run: make infra
      - name: Seed Bronze
        run: make seed
      - name: Run local pipeline
        run: make pipeline
      - name: Query Gold
        run: make query
      - name: Live integration tests
        run: make test-integration
      - name: MiniStack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200 ministack || true
